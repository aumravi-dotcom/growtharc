<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060B1E">
<title>Pranic Breathing · Guided Metronome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-0:#04081A;
    --navy-1:#070D24;
    --navy-2:#0C1638;
    --gold:#D4AF37;
    --gold-soft:#E8CE7A;
    --gold-dim:rgba(212,175,55,.35);
    --ink:#EAE6DA;
    --mute:rgba(234,230,218,.42);
    --breath:#8FD6E8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--navy-0);
    color:var(--ink);
    font-family:'Jost',sans-serif;
    font-weight:300;
    overflow:hidden;
    overscroll-behavior:none;
  }

  /* ---------- atmosphere ---------- */
  #stage{
    position:relative;
    min-height:100dvh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:clamp(12px,2.6vh,26px);
    padding:clamp(30px,7vh,68px) 20px calc(clamp(30px,7vh,68px) + env(safe-area-inset-bottom));
    isolation:isolate;
  }
  #stage::before{
    content:"";position:absolute;inset:0;z-index:-2;
    background:
      radial-gradient(120% 80% at 50% 8%, var(--navy-2) 0%, var(--navy-1) 42%, var(--navy-0) 78%),
      radial-gradient(60% 40% at 50% 105%, rgba(212,175,55,.10), transparent 70%);
  }
  #stage::after{  /* grain */
    content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.35;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.5'/></svg>");
    mix-blend-mode:overlay;
  }

  /* ---------- header ---------- */
  header{text-align:center;opacity:0;animation:rise .9s .1s ease forwards}
  .eyebrow{
    font-size:clamp(9px,2.6vw,11px);letter-spacing:.42em;text-transform:uppercase;
    color:var(--gold);opacity:.8;
  }
  h1{
    font-family:'Cormorant Garamond',serif;font-weight:300;
    font-size:clamp(26px,7vw,42px);letter-spacing:.06em;margin-top:8px;line-height:1.1;
  }
  .rule{
    width:56px;height:1px;margin:12px auto 0;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }

  /* ---------- orb ---------- */
  #orbWrap{
    position:relative;flex:0 0 auto;width:100%;
    display:flex;align-items:center;justify-content:center;
    opacity:0;animation:rise 1.1s .25s ease forwards;
  }
  #orb{
    position:relative;
    width:min(66vw,300px,38vh);aspect-ratio:1;
    display:grid;place-items:center;
    transform:scale(.55);
    will-change:transform;
  }
  .halo{
    position:absolute;inset:-34%;border-radius:50%;
    background:radial-gradient(circle,rgba(143,214,232,.22) 0%,rgba(143,214,232,.06) 42%,transparent 68%);
    filter:blur(14px);
  }
  .ringSvg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .ringTrack{fill:none;stroke:rgba(234,230,218,.10);stroke-width:1.5}
  .ringProg{fill:none;stroke:url(#goldGrad);stroke-width:2.5;stroke-linecap:round;transition:stroke .6s ease}
  .core{
    position:absolute;inset:11%;border-radius:50%;
    background:
      radial-gradient(circle at 38% 32%, rgba(232,206,122,.20), rgba(12,22,56,.85) 62%),
      radial-gradient(circle at 50% 50%, rgba(143,214,232,.10), transparent 70%);
    border:1px solid rgba(212,175,55,.22);
    box-shadow:0 0 70px rgba(143,214,232,.10) inset, 0 0 40px rgba(4,8,26,.9);
  }
  #orbText{position:relative;text-align:center;z-index:2}
  #phase{
    font-family:'Cormorant Garamond',serif;font-weight:300;font-style:italic;
    font-size:clamp(22px,6vw,32px);letter-spacing:.08em;color:var(--gold-soft);
  }
  #beat{
    font-size:clamp(46px,15vw,74px);font-weight:200;line-height:1;
    letter-spacing:.02em;margin-top:2px;
    font-variant-numeric:tabular-nums;
    transition:opacity .18s ease;
  }
  #hint{
    font-size:clamp(9px,2.6vw,11px);letter-spacing:.3em;text-transform:uppercase;
    color:var(--mute);margin-top:10px;min-height:14px;
  }
  #beat.pulse{animation:tick .28s ease}

  /* ---------- footer / meta ---------- */
  footer{width:100%;max-width:440px;opacity:0;animation:rise 1s .4s ease forwards}
  .meta{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);
  }
  .meta b{color:var(--gold);font-weight:400}
  .bar{height:1.5px;background:rgba(234,230,218,.10);margin:10px 0 18px;border-radius:2px;overflow:hidden}
  #barFill{height:100%;width:0;background:linear-gradient(90deg,var(--gold-dim),var(--gold));transition:width .25s linear}

  .controls{display:flex;gap:12px;align-items:center;justify-content:center}
  button{
    font-family:'Jost',sans-serif;font-weight:300;
    letter-spacing:.24em;text-transform:uppercase;font-size:11px;
    color:var(--ink);background:transparent;
    border:1px solid rgba(212,175,55,.30);
    padding:14px 26px;border-radius:999px;cursor:pointer;
    transition:.25s ease;
  }
  button:hover{border-color:var(--gold);color:var(--gold-soft);background:rgba(212,175,55,.06)}
  button:active{transform:scale(.97)}
  #btnMain{
    background:linear-gradient(180deg,rgba(212,175,55,.16),rgba(212,175,55,.05));
    border-color:var(--gold);color:var(--gold-soft);min-width:150px;
  }
  #notice{
    position:absolute;top:0;left:0;right:0;
    text-align:center;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    padding:8px;color:#0A1128;background:var(--gold-soft);
    transform:translateY(-100%);transition:transform .4s ease;
  }
  #notice.on{transform:translateY(0)}

  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes tick{0%{transform:scale(1)}40%{transform:scale(1.10)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="stage">
  <div id="notice"></div>

  <header>
    <div class="eyebrow">Grand Master Choa Kok Sui</div>
    <h1>Pranic Breathing</h1>
    <div class="rule"></div>
  </header>

  <div id="orbWrap">
    <div id="orb">
      <div class="halo"></div>
      <svg class="ringSvg" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#E8CE7A"/>
            <stop offset="100%" stop-color="#D4AF37"/>
          </linearGradient>
        </defs>
        <circle class="ringTrack" cx="100" cy="100" r="94"/>
        <circle class="ringProg" id="ringProg" cx="100" cy="100" r="94"
                stroke-dasharray="590.6" stroke-dashoffset="590.6"/>
      </svg>
      <div class="core"></div>
      <div id="orbText">
        <div id="phase">Ready</div>
        <div id="beat">—</div>
        <div id="hint">Press begin</div>
      </div>
    </div>
  </div>

  <footer>
    <div class="meta">
      <div>Cycle <b id="cycleNow">0</b> / <b id="cycleTot">14</b></div>
      <div id="clock">00:00</div>
    </div>
    <div class="bar"><div id="barFill"></div></div>

    <div class="controls">
      <button id="btnMain">Begin</button>
      <button id="btnReset">Restart</button>
    </div>

  </footer>
</div>

<audio id="au" src="metronome.mp3" preload="auto" playsinline></audio>

<script>
(function(){
  "use strict";

  /* ============================================================
     TIMELINE CONSTANTS — measured from the MCKS metronome track
     ------------------------------------------------------------
     First beep .......... 26.340 s
     Beat interval ....... 0.92095 s  (~65.2 BPM)
     Beeps in the track .. 252  (= 14 cycles of 6-3-6-3)
     Last beep ........... 257.50 s, outro music runs to 285 s
     Beep tone ........... 440 Hz square wave, ~120 ms
     ============================================================ */
  var LEAD_IN   = 26.340;
  var BEAT      = 0.92095;
  var N_BEATS   = 252;
  var TRACK_END = 285.03;

  var PHASES = ['Inhale','Hold','Exhale','Hold'];
  var HINTS  = ['slowly, through the nose','keep it gentle','release completely','stay empty, relaxed'];

  var $ = function(id){ return document.getElementById(id); };
  var au = $('au'), orb = $('orb'), ring = $('ringProg');
  var elPhase=$('phase'), elBeat=$('beat'), elHint=$('hint'),
      elCycle=$('cycleNow'), elCycleTot=$('cycleTot'), elClock=$('clock'),
      elBar=$('barFill'), btnMain=$('btnMain'), btnReset=$('btnReset'),
      notice=$('notice');

  var RING_LEN = 2 * Math.PI * 94;

  /* ---------- state ---------- */
  var PATTERN     = [6,3,6,3];   // Pranic Breathing: inhale 6, hold 3, exhale 6, hold 3
  var CYCLE_LEN   = 18;
  var TOTAL_CYCLES = Math.floor(252 / 18);   // = 14
  var mode      = 'track';        // track | beeps | silent
  var running   = false;
  var trackOK   = true;           // does metronome.mp3 exist?
  var clockT0   = 0;              // performance.now anchor for non-track modes
  var pausedAt  = 0;              // elapsed seconds when paused
  var lastBeat  = -1;
  var raf = null, wakeLock = null, ac = null;

  elCycleTot.textContent = TOTAL_CYCLES;

  /* ---------- synthesised beep: 440 Hz square, 120 ms ---------- */
  function audioCtx(){
    if(!ac){ var C = window.AudioContext || window.webkitAudioContext; if(C) ac = new C(); }
    if(ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function beep(){
    var c = audioCtx(); if(!c) return;
    var t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = 'square'; o.frequency.value = 440;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.16, t + 0.004);
    g.gain.setValueAtTime(0.16, t + 0.114);
    g.gain.linearRampToValueAtTime(0, t + 0.120);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + 0.14);
  }

  /* ---------- master clock ---------- */
  function elapsed(){
    if(mode === 'track' && trackOK) return au.currentTime;
    return pausedAt + (running ? (performance.now() - clockT0) / 1000 : 0);
  }

  /* ---------- easing ---------- */
  function easeSine(p){ return 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, p))); }

  var MIN_S = 0.55, MAX_S = 1.0;

  function render(){
    var t = elapsed();

    /* --- lead-in --- */
    if(t < LEAD_IN){
      var left = Math.ceil(LEAD_IN - t);
      elPhase.textContent = 'Settle';
      elBeat.textContent  = left;
      elHint.textContent  = 'sit upright · relax';
      setScale(MIN_S);
      setRing(1 - (LEAD_IN - t) / LEAD_IN, 'rgba(234,230,218,.25)');
      lastBeat = -1;
      updateFooter(t, 0);
      return;
    }

    var beatF = (t - LEAD_IN) / BEAT;          // fractional beat index
    var beatI = Math.floor(beatF);

    /* --- finished --- */
    if(beatI >= N_BEATS){
      elPhase.textContent = 'Complete';
      elBeat.textContent  = '॥';
      elHint.textContent  = TOTAL_CYCLES + ' cycles finished';
      setScale(MIN_S); setRing(1, 'url(#goldGrad)');
      updateFooter(t, TOTAL_CYCLES);
      if(mode !== 'track' || !trackOK) stop();
      return;
    }

    /* --- which phase --- */
    var cycleIdx = Math.floor(beatI / CYCLE_LEN);
    var inCycle  = beatF - cycleIdx * CYCLE_LEN;  // fractional, 0..18
    var acc = 0, pi = 0;
    for(var i = 0; i < 4; i++){
      if(inCycle < acc + PATTERN[i]){ pi = i; break; }
      acc += PATTERN[i];
      pi = i;
    }
    var within  = inCycle - acc;                  // 0..PATTERN[pi]
    var prog    = within / PATTERN[pi];
    var count   = Math.floor(within) + 1;

    /* --- beep on new beat (non-track modes) --- */
    if(beatI !== lastBeat){
      lastBeat = beatI;
      if(mode === 'beeps') beep();
      elBeat.classList.remove('pulse'); void elBeat.offsetWidth; elBeat.classList.add('pulse');
      if(navigator.vibrate) navigator.vibrate(pi % 2 === 0 ? 14 : 6);
    }

    /* --- orb scale --- */
    var s;
    if(pi === 0)      s = MIN_S + (MAX_S - MIN_S) * easeSine(prog);   // inhale
    else if(pi === 1) s = MAX_S;                                      // hold full
    else if(pi === 2) s = MAX_S - (MAX_S - MIN_S) * easeSine(prog);   // exhale
    else              s = MIN_S;                                      // hold empty
    setScale(s);

    setRing(prog, pi === 0 || pi === 1 ? 'url(#goldGrad)' : '#8FD6E8');

    elPhase.textContent = PHASES[pi];
    elBeat.textContent  = count;
    elHint.textContent  = HINTS[pi];

    updateFooter(t, Math.min(cycleIdx + 1, TOTAL_CYCLES));
  }

  function setScale(s){ orb.style.transform = 'scale(' + s.toFixed(4) + ')'; }
  function setRing(p, color){
    ring.style.strokeDashoffset = (RING_LEN * (1 - Math.min(1, Math.max(0, p)))).toFixed(1);
    ring.style.stroke = color;
  }
  function updateFooter(t, cyc){
    elCycle.textContent = cyc;
    var total = (mode === 'track' && trackOK) ? TRACK_END : LEAD_IN + N_BEATS * BEAT;
    elBar.style.width = Math.min(100, t / total * 100) + '%';
    var s = Math.max(0, Math.floor(t));
    elClock.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
  }

  function loop(){ render(); raf = requestAnimationFrame(loop); }

  /* ---------- wake lock ---------- */
  function lockScreen(){
    if('wakeLock' in navigator){
      navigator.wakeLock.request('screen').then(function(w){ wakeLock = w; }).catch(function(){});
    }
  }
  function unlockScreen(){ if(wakeLock){ wakeLock.release().catch(function(){}); wakeLock = null; } }
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible' && running) lockScreen();
  });

  /* ---------- transport ---------- */
  function start(){
    running = true;
    btnMain.textContent = 'Pause';
    audioCtx();
    if(mode === 'track' && trackOK){
      au.play().catch(function(){ trackOK = false; flash('Track blocked — using beeps'); mode = 'beeps'; start(); });
    } else {
      clockT0 = performance.now();
    }
    lockScreen();
    if(!raf) loop();
  }
  function pause(){
    running = false;
    btnMain.textContent = 'Resume';
    if(mode === 'track' && trackOK) au.pause();
    else pausedAt = elapsed();
    unlockScreen();
  }
  function stop(){
    running = false;
    btnMain.textContent = 'Begin';
    unlockScreen();
  }
  function reset(){
    running = false; pausedAt = 0; lastBeat = -1;
    btnMain.textContent = 'Begin';
    if(!au.paused) au.pause();
    au.currentTime = 0;
    unlockScreen();
    elPhase.textContent = 'Ready'; elBeat.textContent = '—'; elHint.textContent = 'Press begin';
    setScale(MIN_S); setRing(0, 'url(#goldGrad)'); updateFooter(0, 0);
  }

  btnMain.addEventListener('click', function(){ running ? pause() : start(); });
  btnReset.addEventListener('click', function(){ reset(); start(); });

  document.addEventListener('keydown', function(e){
    if(e.code === 'Space'){ e.preventDefault(); running ? pause() : start(); }
    if(e.code === 'KeyR'){ reset(); }
  });

  /* ---------- does the mp3 exist? ---------- */
  au.addEventListener('error', function(){
    trackOK = false;
    mode = 'beeps';
    flash('metronome.mp3 not found — beeps only');
  });
  var flashT;
  function flash(msg){
    notice.textContent = msg; notice.classList.add('on');
    clearTimeout(flashT); flashT = setTimeout(function(){ notice.classList.remove('on'); }, 4200);
  }

  /* ---------- init ---------- */
  reset();
  loop();
})();
</script>
</body>
</html>
