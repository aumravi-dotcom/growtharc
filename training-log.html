<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B0B0C" />
<title>Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#0B0B0C;}
.tl-root{
  --bg:#0B0B0C; --panel:#151517; --line:#26262A; --line2:#33333A;
  --ink:#EDE7DC; --dim:#8A8A90; --accent:#FF5A1F; --green:#64D98A;
  background:var(--bg); color:var(--ink);
  font-family:'Barlow',sans-serif; min-height:100vh; padding:22px 16px 60px;
  background-image:radial-gradient(circle at 50% 0%, rgba(255,90,31,0.07), transparent 55%);
  -webkit-text-size-adjust:100%;
}
.tl-root *{box-sizing:border-box;}
.tl-center{display:flex;align-items:center;justify-content:center;min-height:60vh;}
.tl-loading{font-family:'IBM Plex Mono',monospace;letter-spacing:.3em;color:#8A8A90;font-size:12px;}
.mono{font-family:'IBM Plex Mono',monospace;}

.tl-head{display:flex;gap:14px;align-items:flex-start;max-width:1100px;margin:0 auto 20px;}
.tl-bar{width:5px;align-self:stretch;min-height:52px;background:var(--accent);}
.tl-title{font-family:'Archivo Black',sans-serif;font-size:clamp(26px,6vw,42px);line-height:.92;letter-spacing:-.02em;margin:0;}
.tl-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--dim);margin:8px 0 0;}
.tl-synced{margin-left:auto;display:flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;background:none;border:none;cursor:pointer;padding:4px 0;white-space:nowrap;}
.tl-dot{width:7px;height:7px;border-radius:50%;background:#4A4A50;}
.tl-dot.ok{background:var(--green);}
.tl-dot.busy{background:var(--accent);animation:tlpulse 1s infinite;}
.tl-dot.bad{background:#E0443E;}
@keyframes tlpulse{0%,100%{opacity:1}50%{opacity:.25}}

.tl-nav{display:flex;gap:2px;max-width:1100px;margin:0 auto 20px;border-bottom:1px solid var(--line);overflow-x:auto;}
.tl-tab{background:none;border:none;color:var(--dim);font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;letter-spacing:.04em;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
.tl-tab:hover{color:var(--ink);}
.tl-tab.on{color:var(--accent);border-bottom-color:var(--accent);}

.tl-main{max-width:1100px;margin:0 auto;}
.tl-stack{display:flex;flex-direction:column;gap:14px;}
.tl-err{max-width:1100px;margin:0 auto 12px;background:#3A1508;border:1px solid #6B2A10;color:#FFB894;font-size:12px;padding:8px 12px;}

.tl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(min-width:760px){.tl-grid{grid-template-columns:repeat(4,1fr);}}
.tl-tile{background:var(--panel);border:1px solid var(--line);padding:14px 14px 16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;}
.tl-tile.hero{grid-column:span 2;}
.tl-tile.hero::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,90,31,.10),transparent 60%);}
.tl-cap{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);}
.tl-big{font-family:'Archivo Black',sans-serif;font-size:clamp(28px,7vw,42px);line-height:1;letter-spacing:-.03em;}
.tl-big em{font-family:'IBM Plex Mono',monospace;font-style:normal;font-size:12px;color:var(--dim);margin-left:5px;letter-spacing:0;}
.tl-big.accent{color:var(--accent);}
.tl-note{font-size:11.5px;color:var(--dim);line-height:1.45;}
.tl-note.up{color:var(--green);}
.tl-note.down{color:var(--accent);}
.tl-track{height:4px;background:#26262A;margin-top:4px;}
.tl-fill{height:100%;background:var(--accent);transition:width .5s ease;}
.tl-pips{display:flex;gap:4px;margin-top:2px;}
.tl-pip{width:16px;height:4px;background:#2E2E33;}
.tl-pip.on{background:var(--accent);}

.tl-panel{background:var(--panel);border:1px solid var(--line);padding:16px;}
.tl-panel.tight{padding:0;}
.tl-panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.tl-h2{font-family:'Archivo Black',sans-serif;font-size:13px;letter-spacing:.02em;margin:0 0 10px;text-transform:uppercase;}
.tl-panelhead .tl-h2{margin:0;}
.tl-pills{display:flex;gap:4px;}
.tl-pill{background:#1E1E21;border:1px solid var(--line2);color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;padding:5px 10px;cursor:pointer;text-transform:uppercase;}
.tl-pill:hover{color:var(--ink);}
.tl-pill.on{background:var(--accent);border-color:var(--accent);color:#0B0B0C;font-weight:600;}
.tl-empty{display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;text-align:center;padding:60px 20px;}
.tl-select{background:#1E1E21;border:1px solid var(--line2);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:6px 8px;margin-bottom:10px;width:100%;max-width:280px;}

.tl-days{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.tl-day{background:var(--panel);border:1px solid var(--line);padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:var(--ink);font-family:'Barlow',sans-serif;transition:all .15s;}
.tl-day:hover{border-color:var(--accent);transform:translateY(-2px);}
.tl-day strong{font-family:'Archivo Black',sans-serif;font-size:17px;}
.tl-daytag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;}

.tl-sessionbar{background:var(--accent);color:#0B0B0C;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.tl-sessionbar .tl-cap{color:rgba(11,11,12,.65);}
.tl-livestats{font-family:'Archivo Black',sans-serif;font-size:16px;margin-top:2px;}
.tl-livestats .dot{margin:0 6px;opacity:.5;}
.tl-date{background:rgba(11,11,12,.12);border:1px solid rgba(11,11,12,.3);color:#0B0B0C;font-family:'IBM Plex Mono',monospace;font-size:11px;padding:6px 8px;}
.tl-lift{background:var(--panel);border:1px solid var(--line);padding:14px;}
.tl-lifthead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.tl-lifthead strong{font-size:14px;font-weight:600;}
.tl-target{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);white-space:nowrap;}
.tl-last{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-top:6px;}
.tl-lastset{display:inline-block;background:#1E1E21;padding:2px 6px;margin-right:4px;border:1px solid var(--line2);}
.tl-sets{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
.tl-set{display:flex;align-items:center;gap:6px;}
.tl-setno{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);width:14px;}
.tl-set input{flex:1;min-width:0;background:#1E1E21;border:1px solid var(--line2);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:16px;padding:9px 10px;text-align:center;}
.tl-set input:focus{outline:none;border-color:var(--accent);}
.tl-x{color:var(--dim);font-size:12px;}
.tl-del{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;padding:0 6px;line-height:1;}
.tl-del:hover{color:var(--accent);}
.tl-addset{background:none;border:1px dashed var(--line2);color:var(--dim);width:100%;padding:7px;margin-top:8px;font-family:'Barlow',sans-serif;font-size:12px;cursor:pointer;}
.tl-addset:hover{border-color:var(--accent);color:var(--accent);}
.tl-actions{display:flex;gap:10px;}
.tl-save{flex:1;background:var(--accent);border:none;color:#0B0B0C;font-family:'Archivo Black',sans-serif;font-size:13px;padding:14px;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;}
.tl-save.sm{flex:0 0 auto;padding:9px 18px;font-size:11px;}
.tl-save:disabled{opacity:.3;cursor:not-allowed;}
.tl-discard{background:none;border:1px solid var(--line2);color:var(--dim);padding:14px 20px;cursor:pointer;font-family:'Barlow',sans-serif;font-size:13px;}
.tl-discard.sm{padding:7px 12px;font-size:11px;margin-top:10px;}
.tl-cta{background:none;border:1px solid var(--accent);color:var(--accent);padding:16px;font-family:'Archivo Black',sans-serif;font-size:13px;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;}

.tl-wrow{display:flex;gap:8px;flex-wrap:wrap;}
.tl-wrow .tl-date{background:#1E1E21;border-color:var(--line2);color:var(--ink);flex:1;min-width:130px;}
.tl-kg{background:#1E1E21;border:1px solid var(--line2);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:16px;padding:6px 10px;width:90px;text-align:center;}
.tl-kg:focus{outline:none;border-color:var(--accent);}
.tl-entry{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px;}
.tl-entry span{color:var(--dim);flex:1;}
.tl-entry strong{font-size:14px;}

.tl-histhead{width:100%;background:none;border:none;color:var(--ink);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;text-align:left;font-family:'Barlow',sans-serif;}
.tl-histhead:hover{background:#1A1A1D;}
.tl-histhead strong{font-size:14px;}
.tl-histmeta{font-size:11px;color:var(--dim);}
.tl-histbody{padding:0 16px 16px;border-top:1px solid var(--line);}
.tl-histlift{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px;}
.tl-histlift span:last-child{color:var(--dim);font-size:11px;white-space:nowrap;}

.tl-datatools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.tl-ghost{background:none;border:1px solid var(--line2);color:var(--dim);padding:8px 14px;font-family:'Barlow',sans-serif;font-size:12px;cursor:pointer;}
.tl-ghost:hover{border-color:var(--accent);color:var(--accent);}
</style>
</head>
<body>
<div id="root"><div class="tl-root tl-center"><div class="tl-loading">LOADING</div></div></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-type="module">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ================================================================== */
/*  SYNC CONFIG — fill these two in after deploying Code.gs            */
/* ================================================================== */
const SYNC_URL    = 'PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE';
const SYNC_SECRET = 'CHANGE-THIS-TO-SOMETHING-RANDOM';
/* Must match SECRET in Code.gs exactly. Leave SYNC_URL as-is to run offline. */
const SYNC_ON = SYNC_URL.indexOf('script.google.com') !== -1;

/* ---------------- TEMPLATES ---------------- */
const TEMPLATES = {
  upperA:{label:"Upper A",sub:"Push · Shoulders",day:"Mon",lifts:[
    {name:"Seated DB Shoulder Press",target:"4 × 6–10"},
    {name:"Incline Press",target:"3 × 8–12"},
    {name:"Cable Lateral Raise",target:"4 × 12–20"},
    {name:"Machine Chest Press / Dips",target:"3 × 10–15"},
    {name:"Overhead Rope Extension",target:"3 × 10–15"},
    {name:"Triceps Pushdown",target:"2 × 12–20"}]},
  lowerA:{label:"Lower A",sub:"Quads · Abs",day:"Tue",lifts:[
    {name:"Back Squat / Hack Squat",target:"4 × 5–8"},
    {name:"Bulgarian Split Squat",target:"3 × 8–12"},
    {name:"Leg Press",target:"3 × 10–15"},
    {name:"Leg Extension",target:"3 × 12–20"},
    {name:"Standing Calf Raise",target:"4 × 10–15"},
    {name:"Cable Crunch",target:"3 × 10–15"}]},
  upperB:{label:"Upper B",sub:"Pull · Biceps",day:"Thu",lifts:[
    {name:"Pull-up / Lat Pulldown",target:"4 × 6–10"},
    {name:"Chest-Supported Row",target:"4 × 8–12"},
    {name:"Face Pull",target:"3 × 15–20"},
    {name:"Incline DB Curl",target:"3 × 8–12"},
    {name:"Cable / Preacher Curl",target:"3 × 10–15"},
    {name:"Hammer Curl",target:"2 × 10–15"}]},
  lowerB:{label:"Lower B",sub:"Glutes · Hams",day:"Fri",lifts:[
    {name:"Romanian Deadlift",target:"4 × 6–10"},
    {name:"Hip Thrust",target:"4 × 8–12"},
    {name:"Leg Curl",target:"3 × 10–15"},
    {name:"Walking Lunge",target:"3 × 10–12"},
    {name:"Seated Calf Raise",target:"3 × 12–20"},
    {name:"Hanging Leg Raise",target:"3 × 8–15"}]},
};

const KEY="traininglog-v1", GOAL_KG=78, START_KG=72;

/* ---------------- HELPERS ---------------- */
const todayISO=()=>new Date().toISOString().slice(0,10);
function mondayOf(s){const d=new Date(s+"T00:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toISOString().slice(0,10);}
function shiftWeeks(m,n){const d=new Date(m+"T00:00:00");d.setDate(d.getDate()+n*7);return d.toISOString().slice(0,10);}
const sessionVolume=s=>s.lifts.reduce((a,l)=>a+l.sets.reduce((b,x)=>b+(+x.w||0)*(+x.r||0),0),0);
const sessionSets=s=>s.lifts.reduce((a,l)=>a+l.sets.filter(x=>+x.r>0).length,0);
const e1rm=(w,r)=>(+w||0)*(1+(+r||0)/30);
const fmt=n=>n>=1000?(n/1000).toFixed(1).replace(/\.0$/,"")+"k":Math.round(n);
const shortDate=iso=>new Date(iso+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});

/* ---------------- SVG CHARTS ---------------- */
const W=700,H=300,PL=52,PR=14,PT=16,PB=34;

function Grid({min,max,ticks=4,fmtY}){
  const rows=[];
  for(let i=0;i<=ticks;i++){
    const v=min+((max-min)*i)/ticks;
    const y=H-PB-((v-min)/(max-min||1))*(H-PT-PB);
    rows.push(<g key={i}>
      <line x1={PL} x2={W-PR} y1={y} y2={y} stroke="#232326" strokeWidth="1"/>
      <text x={PL-8} y={y+4} textAnchor="end" fill="#6C6C72" fontSize="11" fontFamily="'IBM Plex Mono',monospace">{fmtY(v)}</text>
    </g>);
  }
  return <g>{rows}</g>;
}
function XLabels({data,every}){
  const step=(W-PL-PR)/data.length;
  return <g>{data.map((d,i)=> i%every===0 ?
    <text key={i} x={PL+step*(i+.5)} y={H-PB+20} textAnchor="middle" fill="#6C6C72"
      fontSize="11" fontFamily="'IBM Plex Mono',monospace">{d.label}</text> : null)}</g>;
}
function BarChart({data,unit}){
  const max=Math.max(1,...data.map(d=>d.v))*1.1;
  const step=(W-PL-PR)/data.length, bw=Math.min(38,step*0.6);
  return (<svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:"block"}}>
    <Grid min={0} max={max} fmtY={fmt}/>
    {data.map((d,i)=>{const h=(d.v/max)*(H-PT-PB);
      return <rect key={i} x={PL+step*(i+.5)-bw/2} y={H-PB-h} width={bw} height={Math.max(0,h)} fill="#FF5A1F">
        <title>{d.label}: {Math.round(d.v).toLocaleString()} {unit}</title></rect>;})}
    <XLabels data={data} every={2}/>
  </svg>);
}
function LineChartSVG({data,color,unit,pad=1}){
  const vals=data.map(d=>d.v);
  const min=Math.min(...vals)-pad, max=Math.max(...vals)+pad;
  const step=(W-PL-PR)/data.length;
  const px=i=>PL+step*(i+.5), py=v=>H-PB-((v-min)/((max-min)||1))*(H-PT-PB);
  return (<svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:"block"}}>
    <Grid min={min} max={max} fmtY={v=>v.toFixed(1)}/>
    <polyline points={data.map((d,i)=>`${px(i)},${py(d.v)}`).join(" ")} fill="none"
      stroke={color} strokeWidth="3" strokeLinejoin="round" strokeLinecap="round"/>
    {data.map((d,i)=><circle key={i} cx={px(i)} cy={py(d.v)} r="4" fill={color}>
      <title>{d.label}: {d.v} {unit}</title></circle>)}
    <XLabels data={data} every={Math.max(1,Math.ceil(data.length/7))}/>
  </svg>);
}

/* ---------------- MERGE (mirrors the server) ---------------- */
function mergeState(a,b){
  const del={};
  (a.deleted||[]).concat(b.deleted||[]).forEach(k=>{del[k]=1;});
  const byId={};
  (a.sessions||[]).concat(b.sessions||[]).forEach(s=>{
    if(del[String(s.id)])return;
    const c=byId[s.id];
    if(!c||(s.savedAt||0)>(c.savedAt||0))byId[s.id]=s;});
  const byDate={};
  (a.weights||[]).concat(b.weights||[]).forEach(w=>{
    if(del["w:"+w.date])return;
    const c=byDate[w.date];
    if(!c||(w.savedAt||0)>(c.savedAt||0))byDate[w.date]=w;});
  return {
    sessions:Object.values(byId).sort((x,y)=>String(x.date).localeCompare(String(y.date))),
    weights:Object.values(byDate).sort((x,y)=>String(x.date).localeCompare(String(y.date))),
    deleted:Object.keys(del)
  };
}

/* ---------------- ROOT ---------------- */
function App(){
  const [tab,setTab]=useState("dash");
  const [data,setData]=useState({sessions:[],weights:[],deleted:[]});
  const [draft,setDraft]=useState(null);
  const [err,setErr]=useState(null);
  const [sync,setSync]=useState(SYNC_ON?"idle":"off");
  const [lastSync,setLastSync]=useState(null);
  const hydrated=useRef(false);
  const timer=useRef(null);
  const pushed=useRef("");

  const {sessions,weights}=data;

  /* --- load from this device --- */
  useEffect(()=>{
    try{
      const raw=localStorage.getItem(KEY);
      if(raw){const d=JSON.parse(raw);
        setData({sessions:d.sessions||[],weights:d.weights||[],deleted:d.deleted||[]});
        setDraft(d.draft||null);}
    }catch(e){}
    hydrated.current=true;
  },[]);

  /* --- persist to this device --- */
  useEffect(()=>{
    if(!hydrated.current)return;
    try{ localStorage.setItem(KEY,JSON.stringify({...data,draft})); }
    catch(e){ setErr("Couldn't save locally — browser storage is blocked or full."); }
  },[data,draft]);

  /* --- push + pull in one round trip --- */
  const doSync=useCallback(async(state)=>{
    if(!SYNC_ON)return;
    setSync("busy");
    try{
      const res=await fetch(SYNC_URL,{
        method:"POST", redirect:"follow",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({action:"sync",secret:SYNC_SECRET,state})
      });
      const out=await res.json();
      if(!out.ok)throw new Error(out.error||"sync failed");
      const merged=mergeState(out.state,{});
      pushed.current=JSON.stringify(merged);
      setData(d=>{
        const local=JSON.stringify(mergeState(d,{}));
        return local===pushed.current?d:merged;
      });
      setSync("ok");
      setLastSync(new Date());
      setErr(null);
    }catch(e){
      setSync("bad");
      setErr("Sync failed — your data is safe on this device. Tap the status dot to retry.");
    }
  },[]);

  /* --- sync on open, on change (debounced), and on返回 to the tab --- */
  useEffect(()=>{
    if(!hydrated.current||!SYNC_ON)return;
    const snap=JSON.stringify(mergeState(data,{}));
    if(snap===pushed.current)return;
    clearTimeout(timer.current);
    timer.current=setTimeout(()=>doSync(data),1500);
    return()=>clearTimeout(timer.current);
  },[data,doSync]);

  useEffect(()=>{
    if(!SYNC_ON)return;
    const t=setTimeout(()=>doSync(JSON.parse(localStorage.getItem(KEY)||"{}")),400);
    const onFocus=()=>{ if(document.visibilityState==="visible") doSync(data); };
    document.addEventListener("visibilitychange",onFocus);
    return()=>{clearTimeout(t);document.removeEventListener("visibilitychange",onFocus);};
  },[]);

  /* --- mutations --- */
  const addSession=s=>setData(d=>({...d,sessions:[...d.sessions,{...s,savedAt:Date.now()}]}));
  const delSession=id=>setData(d=>({...d,
    sessions:d.sessions.filter(x=>x.id!==id),
    deleted:[...new Set([...d.deleted,String(id)])]}));
  const addWeight=(date,kg)=>setData(d=>({...d,
    weights:[...d.weights.filter(w=>w.date!==date),{date,kg:+kg,savedAt:Date.now()}],
    deleted:d.deleted.filter(k=>k!=="w:"+date)}));
  const delWeight=date=>setData(d=>({...d,
    weights:d.weights.filter(w=>w.date!==date),
    deleted:[...new Set([...d.deleted,"w:"+date])]}));
  const replaceAll=st=>setData(d=>mergeState(d,st));

  /* --- stats --- */
  const stats=useMemo(()=>{
    const tw=mondayOf(todayISO()), lw=shiftWeeks(tw,-1);
    const inWeek=w=>sessions.filter(s=>mondayOf(s.date)===w);
    const cur=inWeek(tw), prev=inWeek(lw);
    const cv=cur.reduce((a,s)=>a+sessionVolume(s),0);
    const pv=prev.reduce((a,s)=>a+sessionVolume(s),0);
    const sorted=[...weights].sort((a,b)=>a.date.localeCompare(b.date));
    const latest=sorted.length?+sorted[sorted.length-1].kg:START_KG;
    const c=new Date();c.setDate(c.getDate()-30);
    const cut=c.toISOString().slice(0,10);
    const before={},after={};
    [...sessions].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>
      s.lifts.forEach(l=>l.sets.forEach(x=>{
        if(!(+x.w>0&&+x.r>0))return;
        const t=s.date<cut?before:after;
        t[l.name]=Math.max(t[l.name]||0,e1rm(x.w,x.r));})));
    const prs=Object.keys(after).filter(k=>after[k]>(before[k]||0)).length;
    return {weight:latest,toGo:Math.max(0,GOAL_KG-latest),
      pct:Math.min(100,Math.max(0,((latest-START_KG)/(GOAL_KG-START_KG))*100)),
      volume:cv,delta:pv>0?((cv-pv)/pv)*100:null,
      sessionsWeek:cur.length,setsWeek:cur.reduce((a,s)=>a+sessionSets(s),0),
      prs,total:sessions.length};
  },[sessions,weights]);

  const syncLabel={off:"Local only",idle:"Not synced",busy:"Syncing",ok:lastSync?
    "Synced "+lastSync.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"Synced",
    bad:"Sync failed"}[sync];
  const dotClass={off:"",idle:"",busy:"busy",ok:"ok",bad:"bad"}[sync];

  return (
    <div className="tl-root">
      <header className="tl-head">
        <div className="tl-bar"/>
        <div>
          <h1 className="tl-title">TRAINING LOG</h1>
          <p className="tl-sub">72 → 78 KG · UPPER/LOWER × 2 · {stats.total} SESSIONS BANKED</p>
        </div>
        <button className="tl-synced" onClick={()=>doSync(data)} title="Sync now">
          <span className={"tl-dot "+dotClass}/>{syncLabel}
        </button>
      </header>

      <nav className="tl-nav">
        {[["dash","Dashboard"],["log","Log"],["weight","Bodyweight"],["hist","History"]].map(([k,v])=>(
          <button key={k} className={"tl-tab"+(tab===k?" on":"")} onClick={()=>setTab(k)}>{v}</button>))}
      </nav>

      {err && <div className="tl-err">{err}</div>}

      <main className="tl-main">
        {tab==="dash" && <Dashboard stats={stats} sessions={sessions} weights={weights} onLog={()=>setTab("log")}/>}
        {tab==="log" && <Logger draft={draft} setDraft={setDraft} sessions={sessions}
          onSave={s=>{addSession(s);setDraft(null);setTab("dash");}}/>}
        {tab==="weight" && <WeightTab weights={weights} addWeight={addWeight} delWeight={delWeight}/>}
        {tab==="hist" && <History sessions={sessions} delSession={delSession}
          data={data} replaceAll={replaceAll}/>}
      </main>
    </div>);
}

/* ---------------- DASHBOARD ---------------- */
function Dashboard({stats,sessions,weights,onLog}){
  const [chart,setChart]=useState("volume");
  const [lift,setLift]=useState("");

  const volumeData=useMemo(()=>{
    const wk=mondayOf(todayISO());
    return Array.from({length:10},(_,i)=>{
      const m=shiftWeeks(wk,i-9);
      return {label:shortDate(m),
        v:sessions.filter(s=>mondayOf(s.date)===m).reduce((a,s)=>a+sessionVolume(s),0)};});
  },[sessions]);

  const weightData=useMemo(()=>[...weights].sort((a,b)=>a.date.localeCompare(b.date))
    .slice(-30).map(w=>({label:shortDate(w.date),v:+w.kg})),[weights]);

  const liftNames=useMemo(()=>{
    const seen={};
    sessions.forEach(s=>s.lifts.forEach(l=>{
      if(l.sets.some(x=>+x.w>0))seen[l.name]=(seen[l.name]||0)+1;}));
    return Object.keys(seen).sort((a,b)=>seen[b]-seen[a]);
  },[sessions]);
  const chosen=lift||liftNames[0]||"";

  const strengthData=useMemo(()=>{
    if(!chosen)return[];
    return [...sessions].sort((a,b)=>a.date.localeCompare(b.date)).map(s=>{
      const l=s.lifts.find(x=>x.name===chosen); if(!l)return null;
      const best=Math.max(0,...l.sets.map(x=>e1rm(x.w,x.r)));
      return best>0?{label:shortDate(s.date),v:+best.toFixed(1)}:null;
    }).filter(Boolean);
  },[sessions,chosen]);

  return (
    <div className="tl-stack">
      <section className="tl-grid">
        <div className="tl-tile hero">
          <span className="tl-cap">Bodyweight</span>
          <div className="tl-big">{stats.weight.toFixed(1)}<em>kg</em></div>
          <div className="tl-track"><div className="tl-fill" style={{width:stats.pct+"%"}}/></div>
          <span className="tl-note">{stats.toGo>0
            ? stats.toGo.toFixed(1)+" kg to target of "+GOAL_KG
            : "Target of "+GOAL_KG+" kg reached"}</span>
        </div>
        <div className="tl-tile">
          <span className="tl-cap">Volume this week</span>
          <div className="tl-big">{fmt(stats.volume)}<em>kg</em></div>
          <span className={"tl-note "+(stats.delta==null?"":stats.delta>=0?"up":"down")}>
            {stats.delta==null?"no prior week":(stats.delta>=0?"▲ ":"▼ ")+Math.abs(stats.delta).toFixed(0)+"% vs last week"}</span>
        </div>
        <div className="tl-tile">
          <span className="tl-cap">Sessions</span>
          <div className="tl-big">{stats.sessionsWeek}<em>/ 4</em></div>
          <div className="tl-pips">{[0,1,2,3].map(i=>
            <span key={i} className={"tl-pip"+(i<stats.sessionsWeek?" on":"")}/>)}</div>
        </div>
        <div className="tl-tile">
          <span className="tl-cap">Working sets</span>
          <div className="tl-big">{stats.setsWeek}</div>
          <span className="tl-note">this week</span>
        </div>
        <div className="tl-tile">
          <span className="tl-cap">Personal records</span>
          <div className="tl-big accent">{stats.prs}</div>
          <span className="tl-note">last 30 days</span>
        </div>
      </section>

      <section className="tl-panel">
        <div className="tl-panelhead">
          <h2 className="tl-h2">Progress</h2>
          <div className="tl-pills">
            {[["volume","Volume"],["weight","Bodyweight"],["strength","Strength"]].map(([k,v])=>(
              <button key={k} className={"tl-pill"+(chart===k?" on":"")} onClick={()=>setChart(k)}>{v}</button>))}
          </div>
        </div>
        {chart==="strength" && liftNames.length>0 &&
          <select className="tl-select" value={chosen} onChange={e=>setLift(e.target.value)}>
            {liftNames.map(n=><option key={n} value={n}>{n}</option>)}</select>}
        {chart==="volume" && <BarChart data={volumeData} unit="kg"/>}
        {chart==="weight" && (weightData.length>1
          ? <LineChartSVG data={weightData} color="#FF5A1F" unit="kg"/>
          : <div className="tl-empty">Log bodyweight a few times to see the trend.</div>)}
        {chart==="strength" && (strengthData.length>1
          ? <LineChartSVG data={strengthData} color="#64D98A" unit="kg" pad={3}/>
          : <div className="tl-empty">Log the same lift twice to track estimated 1RM.</div>)}
      </section>

      {sessions.length===0 && <button className="tl-cta" onClick={onLog}>Start your first session →</button>}
    </div>);
}

/* ---------------- LOGGER ---------------- */
function Logger({draft,setDraft,sessions,onSave}){
  const start=key=>setDraft({id:Date.now(),date:todayISO(),key,
    lifts:TEMPLATES[key].lifts.map(l=>({name:l.name,target:l.target,sets:[{w:"",r:""}]}))});

  const lastFor=name=>{
    const past=[...sessions].sort((a,b)=>b.date.localeCompare(a.date))
      .find(s=>s.lifts.some(l=>l.name===name&&l.sets.some(x=>+x.w>0)));
    if(!past)return null;
    const l=past.lifts.find(x=>x.name===name);
    return {date:shortDate(past.date),sets:l.sets.filter(x=>+x.w>0||+x.r>0)};
  };

  if(!draft) return (
    <div className="tl-stack">
      <h2 className="tl-h2">Pick today's session</h2>
      <div className="tl-days">
        {Object.entries(TEMPLATES).map(([k,t])=>(
          <button key={k} className="tl-day" onClick={()=>start(k)}>
            <span className="tl-daytag">{t.day}</span>
            <strong>{t.label}</strong>
            <span className="tl-note">{t.sub}</span>
          </button>))}
      </div>
    </div>);

  const upd=(li,si,f,v)=>setDraft(d=>({...d,lifts:d.lifts.map((l,i)=>
    i!==li?l:{...l,sets:l.sets.map((s,j)=>j!==si?s:{...s,[f]:v})})}));
  const addSet=li=>setDraft(d=>({...d,lifts:d.lifts.map((l,i)=>{
    if(i!==li)return l;
    const p=l.sets[l.sets.length-1]||{w:"",r:""};
    return {...l,sets:[...l.sets,{w:p.w,r:""}]};})}));
  const delSet=(li,si)=>setDraft(d=>({...d,lifts:d.lifts.map((l,i)=>
    i!==li?l:{...l,sets:l.sets.filter((_,j)=>j!==si)})}));

  const vol=sessionVolume(draft), nSets=sessionSets(draft);

  return (
    <div className="tl-stack">
      <div className="tl-sessionbar">
        <div>
          <span className="tl-cap">{TEMPLATES[draft.key].label}</span>
          <div className="tl-livestats">{nSets} sets<span className="dot">·</span>{fmt(vol)} kg volume</div>
        </div>
        <input type="date" className="tl-date" value={draft.date}
          onChange={e=>setDraft(d=>({...d,date:e.target.value}))}/>
      </div>

      {draft.lifts.map((l,li)=>{
        const last=lastFor(l.name);
        return (
          <div key={l.name} className="tl-lift">
            <div className="tl-lifthead"><strong>{l.name}</strong><span className="tl-target">{l.target}</span></div>
            {last && <div className="tl-last">Last {last.date}:{" "}
              {last.sets.map((s,i)=><span key={i} className="tl-lastset">{s.w}×{s.r}</span>)}</div>}
            <div className="tl-sets">
              {l.sets.map((s,si)=>(
                <div key={si} className="tl-set">
                  <span className="tl-setno">{si+1}</span>
                  <input type="number" inputMode="decimal" placeholder="kg" value={s.w}
                    onChange={e=>upd(li,si,"w",e.target.value)}/>
                  <span className="tl-x">×</span>
                  <input type="number" inputMode="numeric" placeholder="reps" value={s.r}
                    onChange={e=>upd(li,si,"r",e.target.value)}/>
                  <button className="tl-del" onClick={()=>delSet(li,si)}>×</button>
                </div>))}
            </div>
            <button className="tl-addset" onClick={()=>addSet(li)}>+ Add set</button>
          </div>);
      })}

      <div className="tl-actions">
        <button className="tl-discard" onClick={()=>setDraft(null)}>Discard</button>
        <button className="tl-save" disabled={nSets===0} onClick={()=>onSave({...draft,
          lifts:draft.lifts.map(l=>({...l,sets:l.sets.filter(s=>+s.w>0||+s.r>0)}))})}>
          Finish session</button>
      </div>
    </div>);
}

/* ---------------- BODYWEIGHT ---------------- */
function WeightTab({weights,addWeight,delWeight}){
  const [kg,setKg]=useState(""); const [date,setDate]=useState(todayISO());
  const sorted=[...weights].sort((a,b)=>b.date.localeCompare(a.date));

  const weekly=useMemo(()=>{
    const b={};
    weights.forEach(w=>{const m=mondayOf(w.date);(b[m]=b[m]||[]).push(+w.kg);});
    return Object.keys(b).sort().slice(-8).map(m=>({label:shortDate(m),
      v:+(b[m].reduce((x,y)=>x+y,0)/b[m].length).toFixed(1)}));
  },[weights]);

  const add=()=>{ if(!(+kg>0))return; addWeight(date,kg); setKg(""); };

  return (
    <div className="tl-stack">
      <div className="tl-panel">
        <h2 className="tl-h2">Log bodyweight</h2>
        <p className="tl-note" style={{marginBottom:14}}>Same time each morning, before food.
          Judge progress by the weekly average, never a single day.</p>
        <div className="tl-wrow">
          <input type="date" className="tl-date" value={date} onChange={e=>setDate(e.target.value)}/>
          <input type="number" inputMode="decimal" className="tl-kg" placeholder="kg" value={kg}
            onChange={e=>setKg(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/>
          <button className="tl-save sm" onClick={add}>Add</button>
        </div>
      </div>

      {weekly.length>1 &&
        <div className="tl-panel">
          <h2 className="tl-h2">Weekly average</h2>
          <LineChartSVG data={weekly} color="#FF5A1F" unit="kg"/>
          <p className="tl-note">Target pace: 0.7–1.0 kg per month. Faster than that is mostly fat.</p>
        </div>}

      <div className="tl-panel">
        <h2 className="tl-h2">Entries</h2>
        {sorted.length===0 && <p className="tl-note">Nothing logged yet.</p>}
        {sorted.slice(0,30).map(w=>(
          <div key={w.date} className="tl-entry">
            <span className="mono">{shortDate(w.date)}</span>
            <strong className="mono">{(+w.kg).toFixed(1)} kg</strong>
            <button className="tl-del" onClick={()=>delWeight(w.date)}>×</button>
          </div>))}
      </div>
    </div>);
}

/* ---------------- HISTORY + BACKUP ---------------- */
function History({sessions,delSession,data,replaceAll}){
  const [open,setOpen]=useState(null);
  const sorted=[...sessions].sort((a,b)=>b.date.localeCompare(a.date));

  const exportData=()=>{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="training-log-"+todayISO()+".json";
    a.click(); URL.revokeObjectURL(a.href);
  };
  const importData=e=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ try{ replaceAll(JSON.parse(r.result)); }
      catch(err){ alert("That file couldn't be read."); } };
    r.readAsText(f); e.target.value="";
  };

  return (
    <div className="tl-stack">
      <div className="tl-panel">
        <h2 className="tl-h2">Backup</h2>
        <p className="tl-note">{SYNC_ON
          ? "Synced to your Google Sheet. Export anyway if you want an offline copy."
          : "Data lives in this browser only. Export regularly to keep a copy."}</p>
        <div className="tl-datatools">
          <button className="tl-ghost" onClick={exportData}>Export JSON</button>
          <label className="tl-ghost" style={{display:"inline-block"}}>
            Import JSON
            <input type="file" accept="application/json" style={{display:"none"}} onChange={importData}/>
          </label>
        </div>
      </div>

      {!sorted.length && <p className="tl-note">No sessions logged yet.</p>}

      {sorted.map(s=>(
        <div key={s.id} className="tl-panel tight">
          <button className="tl-histhead" onClick={()=>setOpen(open===s.id?null:s.id)}>
            <div>
              <strong>{(TEMPLATES[s.key]||{}).label||"Session"}</strong>
              <div className="tl-note mono">{shortDate(s.date)}</div>
            </div>
            <div className="tl-histmeta mono">{sessionSets(s)} sets · {fmt(sessionVolume(s))} kg</div>
          </button>
          {open===s.id &&
            <div className="tl-histbody">
              {s.lifts.filter(l=>l.sets.length).map(l=>(
                <div key={l.name} className="tl-histlift">
                  <span>{l.name}</span>
                  <span className="mono">{l.sets.map(x=>x.w+"×"+x.r).join("  ")}</span>
                </div>))}
              <button className="tl-discard sm" onClick={()=>delSession(s.id)}>Delete session</button>
            </div>}
        </div>))}
    </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
